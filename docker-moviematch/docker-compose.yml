services:

  mysql1:
    image: mysql:8.0
    container_name: mysql1

    environment:
      MYSQL_ROOT_PASSWORD: ifsp
      MYSQL_DATABASE: moviematch_db1

    ports:
      - "3308:3306"

  mysql2:
    image: mysql:8.0
    container_name: mysql2

    environment:
      MYSQL_ROOT_PASSWORD: ifsp
      MYSQL_DATABASE: moviematch_db2

    ports:
      - "3307:3306"